<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="The Mahalanobis matrix is one read metric, and it has no kernel"><rect width="100%" height="100%" fill="#0b1622"/><text x="18" y="27" font-family="'Crimson Pro', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#e8ecf0">The Mahalanobis matrix is one read metric, and it has no kernel</text><line x1="40.00" y1="212.00" x2="340.00" y2="212.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><line x1="190.00" y1="92.00" x2="190.00" y2="332.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><line x1="380.00" y1="212.00" x2="680.00" y2="212.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><line x1="530.00" y1="92.00" x2="530.00" y2="332.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><ellipse cx="190.00" cy="212.00" rx="79.20" ry="39.60" transform="rotate(-30 190.00 212.00)" fill="#66c2a5" fill-opacity="0.14" stroke="#66c2a5" stroke-width="2"><title>displacements with squared Mahalanobis distance at most 1</title></ellipse><line x1="190.00" y1="212.00" x2="258.59" y2="172.40" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="258.59" y1="172.40" x2="254.71" y2="179.40" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="258.59" y1="172.40" x2="250.59" y2="172.26" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="190.00" y1="212.00" x2="209.80" y2="246.29" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="209.80" y1="246.29" x2="202.80" y2="242.42" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="209.80" y1="246.29" x2="209.94" y2="238.29" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="190.00" y="62.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="middle" font-weight="600">whitening consumer</text><text x="190.00" y="79.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="middle" font-weight="normal">c(x) = Σ^(−1/2) (x − μ)</text><text x="190.00" y="356.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">read metric Σ⁻¹: rank 2, no kernel</text><polygon points="528.50,97.40 628.50,270.60 531.50,326.60 431.50,153.40" fill="#fc8d62" fill-opacity="0.14" stroke="none" stroke-width="0" stroke-linejoin="round"/><line x1="528.50" y1="97.40" x2="628.50" y2="270.60" stroke="#fc8d62" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="531.50" y1="326.60" x2="431.50" y2="153.40" stroke="#fc8d62" stroke-width="2" stroke-linecap="round" stroke-opacity="1.0"/><line x1="480.00" y1="125.40" x2="580.00" y2="298.60" stroke="#8fa4b8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5" stroke-opacity="1.0"/><line x1="530.00" y1="212.00" x2="578.50" y2="184.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="578.50" y1="184.00" x2="574.62" y2="191.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="578.50" y1="184.00" x2="570.50" y2="183.86" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="588.50" y="178.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">read direction u</text><text x="472.00" y="117.40" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="end" font-weight="normal">kernel: not read</text><text x="530.00" y="62.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="middle" font-weight="600">consumer that reads one direction</text><text x="530.00" y="79.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="middle" font-weight="normal">c(x) = u · x</text><text x="530.00" y="356.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">read metric u uᵀ: rank 1, the strip never closes</text><text x="16.00" y="390.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="start" font-weight="normal" font-style="italic">sets of displacements with loss at most 1; illustrative covariance and direction</text></svg>